<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物流商月份双对比看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft YaHei,sans-serif;}
body{background:#edf2f9;padding:40px 20px;max-width:1500px;margin:0 auto;}
h1{text-align:center;color:#1e293b;margin-bottom:42px;font-size:28px;font-weight:600;}
.wrap{display:flex;gap:32px;align-items:flex-start;}
.left-panel, .right-panel{
    flex:1;
    background:#ffffff;
    padding:30px;
    border-radius:14px;
    box-shadow:0 4px 16px rgba(15, 23, 42, 0.08);
}
h3{margin-bottom:20px;color:#0f172a;font-size:20px;}
h4{margin-bottom:14px;color:#475569;font-size:16px;font-weight:500;}
.section{margin-bottom:26px;}
.btn-group{display:flex;flex-wrap:wrap;gap:12px;}
.filter-btn{
    padding:10px 16px;
    border:1px solid #cbd5e1;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    transition:0.2s all ease;
}
.filter-btn:hover{
    border-color:#60a5fa;
}
.filter-btn.active{
    background:#2563eb;
    color:white;
    border:#2563eb;
    box-shadow:0 2px 6px #2563eb40;
}
.jump-area{margin-top:48px;text-align:center;}
#tipText{
    font-size:17px;
    color:#334155;
    margin-bottom:20px;
}
#openCompareBtn{
    padding:14px 36px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 3px 10px #2563eb33;
}
#openCompareBtn:hover:not(:disabled){
    background:#1d4ed8;
}
#openCompareBtn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
    box-shadow:none;
}
@media(max-width:820px){
    .wrap{flex-direction:column;}
}
</style>
</head>
<body>
<h1>📊 物流商月份双对比看板</h1>
<div class="wrap">
    <!-- ========== 左侧面板：对比项A ========== -->
    <div class="left-panel">
        <h3>对比项 A</h3>
        <div class="section">
            <h4>选择物流商</h4>
            <div class="btn-group" id="groupA_logi">
                <button class="filter-btn" data-val="DHL">DHL</button>
                <button class="filter-btn" data-val="EVRI">EVRI</button>
                <button class="filter-btn" data-val="royalmail(菜鸟)">RM</button>
                <button class="filter-btn" data-val="yodel(菜鸟)">YODEL</button>
                <button class="filter-btn" data-val="SD">SD</button>
                <button class="filter-btn" data-val="FEDEX">FEDEX</button>
                <button class="filter-btn" data-val="XDP">XDP</button>
                <button class="filter-btn" data-val="DX">DX</button>
            </div>
        </div>
        <div class="section">
            <h4>选择月份</h4>
            <div class="btn-group" id="groupA_month">
                <button class="filter-btn" data-val="August">8月</button>
                <button class="filter-btn" data-val="July">7月</button>
            </div>
        </div>
    </div>
    <!-- ========== 右侧面板：对比项B ========== -->
    <div class="right-panel">
        <h3>对比项 B</h3>
        <div class="section">
            <h4>选择物流商</h4>
            <div class="btn-group" id="groupB_logi">
                <button class="filter-btn" data-val="DHL">DHL</button>
                <button class="filter-btn" data-val="EVRI">EVRI</button>
                <button class="filter-btn" data-val="royalmail(菜鸟)">RM</button>
                <button class="filter-btn" data-val="yodel(菜鸟)">YODEL</button>
                <button class="filter-btn" data-val="SD">SD</button>
                <button class="filter-btn" data-val="FEDEX">FEDEX</button>
                <button class="filter-btn" data-val="XDP">XDP</button>
                <button class="filter-btn" data-val="DX">DX</button>
            </div>
        </div>
        <div class="section">
            <h4>选择月份</h4>
            <div class="btn-group" id="groupB_month">
                <button class="filter-btn" data-val="August">8月</button>
                <button class="filter-btn" data-val="July">7月</button>
            </div>
        </div>
    </div>
</div>
<div class="jump-area">
    <p id="tipText">请在左右两边分别选好【物流商+月份】，全部选完后打开对比报表</p>
    <button id="openCompareBtn" disabled>🔍 同时打开两份报表进行对比</button>
</div>
<script>
// 存储两组选择
let A = {logi:null, month:null};
let B = {logi:null, month:null};
// 绑定按钮点击
function bindGroup(btnGroupId, targetObj, keyName){
    const btns = document.querySelectorAll(`#${btnGroupId} .filter-btn`);
    btns.forEach(btn=>{
        btn.onclick = ()=>{
            btns.forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            targetObj[keyName] = btn.dataset.val;
            refreshStatus();
        }
    })
}
bindGroup("groupA_logi", A, "logi");
bindGroup("groupA_month", A, "month");
bindGroup("groupB_logi", B, "logi");
bindGroup("groupB_month", B, "month");
// 更新按钮启用状态
function refreshStatus(){
    const tip = document.getElementById("tipText");
    const openBtn = document.getElementById("openCompareBtn");
    if(A.logi && A.month && B.logi && B.month){
        tip.innerText = `A:${A.logi}-${A.month}｜B:${B.logi}-${B.month}`;
        openBtn.disabled = false;
    }else{
        tip.innerText = "请在左右两边分别选好【物流商+月份】";
        openBtn.disabled = true;
    }
}
// 同时打开两个html
document.getElementById("openCompareBtn").onclick = function(){
    // 仓库内全部可用文件清单
    const validList = ["dhl","evri","royalmail(菜鸟)","yodel(菜鸟)","sd","fedex","xdp","dx","extra_large_parcel_courier"];
    let logiA = A.logi;
    let logiB = B.logi;
    // 校验是否存在该物流报表
    if(!validList.includes(logiA) || !validList.includes(logiB)){
        alert("所选物流商没有对应的报表，请重新选择");
        return;
    }
    // 去掉月份拼接，直接读取物流商文件名
    const fileA = `provides_report/${logiA}.html`;
    const fileB = `provides_report/${logiB}.html`;
    window.open(fileA, "_blank");
    window.open(fileB, "_blank");
}
</script>
</body>
</html>
